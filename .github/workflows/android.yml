name: APK Android

on:
  push:
    branches: [main]
    paths:
      - aviones-luna.html
      - package.json
      - package-lock.json
      - capacitor.config.json
      - scripts/**
      - android-res/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar el proyecto Android
        run: npm run android:prepare

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk aviones-luna.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aviones-luna-apk
          path: aviones-luna.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aviones Luna 1.0.${{ github.run_number }}
          body: |
            APK de Aviones Luna para Android 7 o superior.
            Descarga `aviones-luna.apk` desde el móvil, ábrelo y acepta instalar desde esta fuente.
          files: aviones-luna.apk
          make_latest: true
